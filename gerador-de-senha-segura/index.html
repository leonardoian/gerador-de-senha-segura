<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Senha Segura</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Gerador de Senha Segura</h1>
    <p class="subtitle">Crie senhas fortes e aleatórias instantaneamente</p>

    <div class="password-box">
      <span id="password-output" class="password-text">Clique em Gerar</span>
      <button id="copy-btn" class="icon-btn" title="Copiar senha">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>

    <div class="strength-bar-container">
      <div id="strength-bar" class="strength-bar"></div>
    </div>
    <p id="strength-label" class="strength-label"></p>

    <div class="options">
      <div class="option-row">
        <label for="length">Comprimento: <strong id="length-value">16</strong></label>
        <input type="range" id="length" min="6" max="64" value="16" />
      </div>

      <div class="checkboxes">
        <label class="checkbox-label">
          <input type="checkbox" id="uppercase" checked />
          Maiúsculas (A–Z)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="lowercase" checked />
          Minúsculas (a–z)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="numbers" checked />
          Números (0–9)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="symbols" checked />
          Símbolos (!@#$...)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="exclude-similar" />
          Excluir caracteres similares (0, O, l, 1, I)
        </label>
      </div>
    </div>

    <button id="generate-btn" class="generate-btn">Gerar Senha</button>

    <div id="toast" class="toast">Senha copiada!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
